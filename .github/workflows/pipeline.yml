name: Dev → Uat → Prod Promotion Pipeline

on:
  push:
    branches:
      - dev
      - uat

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Code (Example)
        run: |
          echo "Running validation..."
          ls -l

  promote:
    needs: validate
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/uat'
    steps:
      - name: Create Pull Request to next environment
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: |
            ${{ github.ref == 'refs/heads/dev' && 'uat' || 'prod' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: |
            Promote changes from ${{ github.ref_name }} to next environment
          pr_body: |
            This PR promotes from ${{ github.ref_name }} to the next environment.
